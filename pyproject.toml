[project]
name = "dfschema"
version = "0.1.0"
description = "lightweight pandas.DataFrame schema"
authors = [{ name = "Philipp", email = "philippk@zillowgroup.com" }]
readme = "README.md"
requires-python = ">=3.8,<4.0"
dependencies = [
    "pandas>=1.5.3,<3.0",
    "pydantic>=2.2,<3.0",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy==1.*"]
cli = ["typer>=0.6.1,<0.7"]
yaml = ["PyYAML>=6.0,<7.0"]
all = ["sqlalchemy==1.*", "typer>=0.6.1,<0.7", "PyYAML>=6.0,<7.0", "pandera>=0.6,<0.7"]

[project.scripts]
dfschema = "dfschema.cli:app"

[dependency-groups]
dev = [
    "click>=8.0,<8.2",
    "flake8>=5.0.4,<6.0",
    "hypothesis==6.13.12",
    "pytest>=7.1.3,<8.0",
    "typer>=0.6.1,<0.7",
    "pre-commit>=2.19.0,<3.0",
    "MarkupSafe==2.0.1",
    "jupyter>=1.0.0,<2.0",
    "watermark>=2.3.1,<3.0",
    "gitchangelog>=3.0.4,<4.0",
    "black>=24.8.0,<25.0",
    "tomli>=2.0.1 ; python_version < '3.11'",
]
docs = [
    "mdx-include>=1.4.1,<2.0",
    "mkdocs-material>=8.1.4,<9.0",
    "mkdocs>=1.1.2,<2.0",
    "mkdocstrings[python]>=0.19.0,<0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dfschema"]
